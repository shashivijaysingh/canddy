<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:ital,wght@0,100..700;1,100..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
    <title>canddy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: rgb(0, 0, 0);
        }

        img {
            width: 50vw
        }

        p {
            color: white;
            font-size:20px;
            display: block;
            font-family: "Poppins", sans-serif;
            font-weight: 600;
            font-style: normal;
            position: relative;
            top: 10px;
            left: 15%;
            color: rgb(151, 104, 23);
        
            
        }
    </style>
</head>

<body>
    <div class="sweetbox">
        <img src="box.png" alt="canddybox" onclick="change()" id="box">
        <p id="text">Open your mouth and click on the Box👆🏻</p>
    </div>
    <script>
        let box = document.getElementById('box');
        let text = document.getElementById('text');
        // const audio = new Audio('click.mp3');
        let light = false;

        function change() {
            // audio.play();

            if (light == false) {
                box.setAttribute("src", "box.png");
                light = true;
                text.innerHTML = "Open your mouth and click on the Box👆🏻";
            }
            else {
                box.setAttribute("src", "openbox.jpeg");
                light = false;
                text.innerHTML = "KUCHH MEETHA HO JAYE 😊";
            }

        }
    </script>
</body>

</html>
